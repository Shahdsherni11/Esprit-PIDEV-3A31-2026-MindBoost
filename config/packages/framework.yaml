framework:
    secret: '%env(APP_SECRET)%'
    session:
        handler_id: null
        cookie_secure: auto
        cookie_samesite: lax
        storage_factory_id: session.storage.factory.native
    csrf_protection: true
    form:
        csrf_protection: true
    http_method_override: true
    assets: ~
    esi: true
    fragments: true
    php_errors:
        log: true
